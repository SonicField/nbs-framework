<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nbs-chat</title>
<style>
:root {
    --bg: #1e1e1e;
    --fg: #d4d4d4;
    --dim: #888888;
    --border: #333333;
    --header-bg: #252526;
    --msg-hover: #2a2a2a;
    /* xterm-256 colour palette matching terminal.c */
    --handle-0: #00afff; /* 38;5;39  Blue */
    --handle-1: #ff8700; /* 38;5;208 Orange */
    --handle-2: #00d75f; /* 38;5;41  Green */
    --handle-3: #ff87ff; /* 38;5;213 Pink */
    --handle-4: #ffff00; /* 38;5;226 Yellow */
    --handle-5: #5fffff; /* 38;5;87  Cyan */
    --handle-6: #ff0000; /* 38;5;196 Red */
    --handle-7: #afafff; /* 38;5;147 Lavender */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
}

#header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
}

#participants {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
}

.participant {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    white-space: nowrap;
}

.participant .count {
    color: var(--dim);
    margin-left: 2px;
}

#status {
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
}

#status.connected { color: var(--handle-2); }
#status.error { color: var(--handle-6); }

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}

.message {
    padding: 2px 16px;
    display: flex;
    gap: 8px;
    align-items: baseline;
}

.message:hover {
    background: var(--msg-hover);
}

.timestamp {
    color: var(--dim);
    font-size: 11px;
    flex-shrink: 0;
    min-width: 56px;
}

.handle {
    font-weight: 700;
    flex-shrink: 0;
    min-width: 80px;
}

.content {
    flex: 1;
    word-break: break-word;
    white-space: pre-wrap;
}

.content .mention {
    font-weight: 700;
}

.heartbeat-msg {
    color: var(--dim);
    font-style: italic;
}

.heartbeat-msg .handle {
    color: var(--dim) !important;
    font-weight: 400;
}

/* Scrollbar */
#messages::-webkit-scrollbar { width: 8px; }
#messages::-webkit-scrollbar-track { background: var(--bg); }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
#messages::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* Terminal-style input area */
#input-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 0;
}

#handle-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
}

#handle-bar label {
    color: var(--dim);
}

#handle-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 11px;
    padding: 2px 4px;
    width: 120px;
    outline: none;
}

#handle-input:focus {
    border-bottom-color: var(--handle-0);
}

#prompt-line {
    display: flex;
    align-items: flex-start;
    padding: 6px 16px 8px;
}

#prompt-label {
    color: var(--handle-2);
    font-weight: 700;
    flex-shrink: 0;
    padding-top: 1px;
    user-select: none;
}

#msg-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    resize: none;
    outline: none;
    padding: 0 0 0 8px;
    min-height: 20px;
    max-height: 120px;
    overflow-y: auto;
}

#msg-input::placeholder {
    color: var(--dim);
}

#send-hint {
    color: var(--dim);
    font-size: 10px;
    flex-shrink: 0;
    padding-top: 3px;
    padding-left: 8px;
}

#msg-input::-webkit-scrollbar { width: 4px; }
#msg-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="header">
    <h1>nbs-chat</h1>
    <div id="participants"></div>
    <div id="status">Connecting...</div>
</div>
<div id="messages"></div>
<div id="input-area">
    <div id="handle-bar">
        <label for="handle-input">handle:</label>
        <input type="text" id="handle-input" value="alex" spellcheck="false" autocomplete="off">
    </div>
    <div id="prompt-line">
        <span id="prompt-label">&gt; </span>
        <textarea id="msg-input" rows="1" placeholder="Type a message..." spellcheck="false"></textarea>
        <span id="send-hint">Enter to send</span>
    </div>
</div>

<script>
(function() {
    'use strict';

    /* Colour palette matching terminal.c */
    var COLOURS = [
        'var(--handle-0)', 'var(--handle-1)', 'var(--handle-2)',
        'var(--handle-3)', 'var(--handle-4)', 'var(--handle-5)',
        'var(--handle-6)', 'var(--handle-7)'
    ];
    /* Direct hex values for inline styles */
    var COLOUR_HEX = [
        '#00afff', '#ff8700', '#00d75f', '#ff87ff',
        '#ffff00', '#5fffff', '#ff0000', '#afafff'
    ];

    var handleColours = {};
    var nextColour = 0;
    var lastIndex = -1;

    /* Handles known to be heartbeat/sidecar */
    var HEARTBEAT_HANDLES = { 'sidecar': true };

    function getColourIndex(handle) {
        if (!(handle in handleColours)) {
            handleColours[handle] = nextColour;
            nextColour = (nextColour + 1) % COLOUR_HEX.length;
        }
        return handleColours[handle];
    }

    function getColourHex(handle) {
        return COLOUR_HEX[getColourIndex(handle)];
    }

    /* Format timestamp as [HH:MM] */
    function formatTime(epoch) {
        if (!epoch || epoch === 0) return '';
        var d = new Date(epoch * 1000);
        var h = String(d.getHours()).padStart(2, '0');
        var m = String(d.getMinutes()).padStart(2, '0');
        return '[' + h + ':' + m + ']';
    }

    /* Escape HTML entities */
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    /* Highlight @mentions */
    function highlightMentions(html) {
        return html.replace(/@([\w][\w-]*)/g,
            '<span class="mention">@$1</span>');
    }

    /* Check if user is scrolled to bottom */
    function isAtBottom() {
        var el = document.getElementById('messages');
        return el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
    }

    /* Scroll to bottom */
    function scrollToBottom() {
        var el = document.getElementById('messages');
        el.scrollTop = el.scrollHeight;
    }

    /* Render a single message */
    function renderMessage(msg) {
        var container = document.getElementById('messages');
        var atBottom = isAtBottom();

        var div = document.createElement('div');
        div.className = 'message';

        var isHeartbeat = HEARTBEAT_HANDLES[msg.handle] ||
            (msg.content && msg.content.indexOf('Heartbeat:') === 0);
        if (isHeartbeat) div.className += ' heartbeat-msg';

        var ts = document.createElement('span');
        ts.className = 'timestamp';
        ts.textContent = formatTime(msg.timestamp);

        var handle = document.createElement('span');
        handle.className = 'handle';
        handle.textContent = msg.handle;
        handle.style.color = getColourHex(msg.handle);

        var content = document.createElement('span');
        content.className = 'content';
        content.innerHTML = highlightMentions(escapeHtml(msg.content || ''));

        div.appendChild(ts);
        div.appendChild(handle);
        div.appendChild(content);
        container.appendChild(div);

        if (msg.index > lastIndex) lastIndex = msg.index;

        if (atBottom) scrollToBottom();
    }

    /* Update participants bar */
    function updateParticipants(participants) {
        if (!participants) return;
        var el = document.getElementById('participants');
        el.innerHTML = '';
        for (var i = 0; i < participants.length; i++) {
            var p = participants[i];
            var span = document.createElement('span');
            span.className = 'participant';
            span.style.color = getColourHex(p.handle);
            span.innerHTML = escapeHtml(p.handle) +
                '<span class="count">(' + p.count + ')</span>';
            el.appendChild(span);
        }
    }

    /* Set connection status */
    function setStatus(text, cls) {
        var el = document.getElementById('status');
        el.textContent = text;
        el.className = cls || '';
    }

    /* SSE connection */
    function connectSSE() {
        var url = '/events';
        setStatus('Connecting...', '');

        var evtSource = new EventSource(url);

        evtSource.addEventListener('message', function(e) {
            try {
                var msg = JSON.parse(e.data);
                renderMessage(msg);
            } catch (err) {
                console.error('SSE parse error:', err, e.data);
            }
        });

        evtSource.onopen = function() {
            setStatus('Connected', 'connected');
        };

        evtSource.onerror = function() {
            if (evtSource.readyState === EventSource.CLOSED) {
                setStatus('Disconnected — retrying...', 'error');
            } else {
                setStatus('Connection error — retrying...', 'error');
            }
        };
    }

    /* Initial load: fetch all messages via API, then connect SSE */
    function init() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/messages');
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    updateParticipants(data.participants);
                    for (var i = 0; i < data.messages.length; i++) {
                        renderMessage(data.messages[i]);
                    }
                    scrollToBottom();
                } catch (err) {
                    console.error('API parse error:', err);
                }
            }
            /* Connect SSE for live updates after initial load */
            connectSSE();
        };
        xhr.onerror = function() {
            setStatus('Failed to load messages', 'error');
            /* Try SSE anyway */
            connectSSE();
        };
        xhr.send();
    }

    /* Send message via POST /api/send */
    function sendMessage(handle, message) {
        if (!handle || !message) return;

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/send');
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function() {
            if (xhr.status !== 200) {
                console.error('Send failed:', xhr.status, xhr.responseText);
            }
        };
        xhr.onerror = function() {
            console.error('Send error');
        };
        xhr.send(JSON.stringify({ handle: handle, message: message }));
    }

    /* Input handling */
    function setupInput() {
        var input = document.getElementById('msg-input');
        var handleInput = document.getElementById('handle-input');
        var promptLabel = document.getElementById('prompt-label');

        /* Auto-resize textarea */
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        /* Update prompt colour to match handle */
        function updatePromptColour() {
            var h = handleInput.value.trim();
            if (h) {
                promptLabel.style.color = getColourHex(h);
            }
        }
        handleInput.addEventListener('input', updatePromptColour);
        updatePromptColour();

        /* Save handle to localStorage */
        var savedHandle = localStorage.getItem('nbs-chat-handle');
        if (savedHandle) handleInput.value = savedHandle;
        handleInput.addEventListener('change', function() {
            localStorage.setItem('nbs-chat-handle', this.value.trim());
            updatePromptColour();
        });

        /* Enter to send, Shift+Enter for newline */
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                var msg = input.value.trim();
                var handle = handleInput.value.trim();
                if (msg && handle) {
                    sendMessage(handle, msg);
                    input.value = '';
                    input.style.height = 'auto';
                }
            }
        });

        /* Focus input on page load */
        input.focus();
    }

    init();
    setupInput();
})();
</script>
</body>
</html>
